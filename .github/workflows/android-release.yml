name: NISHA AI Android Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_release_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Decode Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "KEYSTORE_BASE64 secret not set; skipping release signing keystore."
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "${{ github.workspace }}/my-upload-key.jks" ]; then
            gradle assembleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Clean Up Keystore File
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nisha-ai-apk
          path: app/build/outputs/apk/**/*.apk
